name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    name: No leaked Apple Team ID
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify no DEVELOPMENT_TEAM is committed
        run: sh scripts/check-no-team-id.sh

  build:
    name: Build (Xcode)
    runs-on: xcode-27
    needs: guard
    steps:
      - uses: actions/checkout@v4
      - name: Build Zanshin
        run: |
          xcodebuild -version
          xcodebuild \
            -project Zanshin.xcodeproj \
            -scheme Zanshin \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build
